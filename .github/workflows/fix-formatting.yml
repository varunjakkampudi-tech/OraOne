# Manual workflow: formats the web app and the backend, then opens a pull
# request with the changes. It never pushes to main directly.
name: Fix formatting

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: bun install --frozen-lockfile
      - name: Format web app
        run: bun run format && bun run lint:fix || true
      - name: Format backend
        run: |
          pip install ruff
          cd backend
          ruff format .
          ruff check . --fix || true
      - name: Open pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/format-code
          commit-message: "chore: apply formatting and lint fixes"
          title: "chore: apply formatting and lint fixes"
          body: "Automated formatting (Prettier, ESLint fixes, Ruff) generated by the Fix formatting workflow."
