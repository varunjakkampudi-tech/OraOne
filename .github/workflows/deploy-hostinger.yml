name: Manual Hostinger deployment

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY to deploy the latest main commit'
        required: true
        type: string
      product:
        description: 'OraOne portfolio product being released'
        required: true
        type: choice
        options:
          - product-1-ai-chat
        default: product-1-ai-chat
      release_version:
        description: 'Semantic release version MAJOR.MINOR.PATCH, without the v prefix'
        required: true
        type: string
      publish_tag:
        description: 'Create an immutable release tag after deployment health checks pass'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: hostinger-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy main to Hostinger
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'DEPLOY'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out the selected main commit
        uses: actions/checkout@v5

      - name: Validate release identity
        id: release
        env:
          PRODUCT_ID: ${{ inputs.product }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          test "$PRODUCT_ID" = "product-1-ai-chat" || {
            echo "Only Product 1 is deployable until its successor product is implemented."
            exit 1
          }
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "release_version must be MAJOR.MINOR.PATCH, for example 1.0.1"
            exit 1
          }
          release_tag="oraone/${PRODUCT_ID}/v${RELEASE_VERSION}"
          if git ls-remote --exit-code --refs origin "refs/tags/$release_tag" > /dev/null 2>&1; then
            echo "Release tag already exists: $release_tag"
            exit 1
          fi
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "version=v${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Configure deployment SSH
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          HOSTINGER_KNOWN_HOSTS: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$HOSTINGER_SSH_KEY"
          test -n "$HOSTINGER_HOST"
          test -n "$HOSTINGER_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          HOSTINGER_SSH_KEY="$HOSTINGER_SSH_KEY" python3 - <<'PY'
          from pathlib import Path
          import os

          value = os.environ["HOSTINGER_SSH_KEY"]
          # GitHub secrets may arrive with literal escaped newlines or CRLF
          # after a browser paste. Normalize only the key material in-memory.
          if "\\n" in value and "\n" not in value:
              value = value.replace("\\n", "\n")
          value = value.replace("\r\n", "\n").replace("\r", "\n")
          if not value.endswith("\n"):
              value += "\n"
          Path(os.environ["HOME"], ".ssh", "id_ed25519").write_text(value)
          PY
          printf '%s\n' "$HOSTINGER_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          test -s "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/id_ed25519" > /dev/null

      - name: Deploy and verify the stack
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ORAONE_PRODUCT_ID: ${{ inputs.product }}
          ORAONE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          test -n "$HOSTINGER_HOST"
          test -n "$HOSTINGER_USER"
          test -n "$OPENAI_API_KEY"
          {
            printf 'export OPENAI_API_KEY=%q\n' "$OPENAI_API_KEY"
            printf 'export ORAONE_PRODUCT_ID=%q\n' "$ORAONE_PRODUCT_ID"
            printf 'export ORAONE_VERSION=%q\n' "$ORAONE_VERSION"
            printf 'export RELEASE_TAG=%q\n' "$RELEASE_TAG"
            cat <<'REMOTE'
          set -euo pipefail
          cd /srv/apps/oraone
          git fetch origin main
          git checkout -B main origin/main
          umask 077
          OPENAI_API_KEY="$OPENAI_API_KEY" ORAONE_PRODUCT_ID="$ORAONE_PRODUCT_ID" ORAONE_VERSION="$ORAONE_VERSION" python3 - <<'PY'
          from pathlib import Path
          import os

          env_path = Path("backend/.env")
          lines = env_path.read_text().splitlines() if env_path.exists() else []
          values = {
              "OPENAI_API_KEY": os.environ["OPENAI_API_KEY"],
              "AI_ALLOW_MOCK": "false",
              "ORAONE_PRODUCT_ID": os.environ["ORAONE_PRODUCT_ID"],
              "ORAONE_VERSION": os.environ["ORAONE_VERSION"],
          }
          output = []
          replaced = set()
          for line in lines:
              key = line.split("=", 1)[0]
              if key in values:
                  output.append(f"{key}={values[key]}")
                  replaced.add(key)
              else:
                  output.append(line)
          for key, value in values.items():
              if key not in replaced:
                  output.append(f"{key}={value}")
          env_path.write_text("\n".join(output) + "\n")
          PY
          docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build --remove-orphans
          docker compose --env-file .env.production -f docker-compose.prod.yml ps
          curl --fail --silent --show-error http://127.0.0.1/api/health/ready
          printf '\nDeployment verified product=%s version=%s tag=%s commit=%s\n' "$ORAONE_PRODUCT_ID" "$ORAONE_VERSION" "$RELEASE_TAG" "$(git rev-parse HEAD)"
          REMOTE
          } | ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o HostKeyAlias=201.18.193.230 "$HOSTINGER_USER@$HOSTINGER_HOST" 'bash -se'

      - name: Create immutable release tag
        if: inputs.publish_tag == true
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCT_ID: ${{ inputs.product }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" "$GITHUB_SHA" -m "OraOne ${PRODUCT_ID} ${RELEASE_VERSION}"
          git push origin "$RELEASE_TAG"
