# Verifies formatting and lint on every push and pull request. Failing this
# workflow means the code needs `bun run format` / `ruff format` (see the
# "Fix formatting" workflow, which can open a pull request automatically).
name: Format and lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: format-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web formatting and ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - name: Prettier (format check)
        run: bun run format:check
      - name: ESLint
        run: bun run lint
      - name: TypeScript
        run: bun run typecheck

  backend:
    name: Backend formatting and Ruff
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Ruff format (check)
        run: ruff format --check .
      - name: Ruff lint
        run: ruff check .
