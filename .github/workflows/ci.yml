# Continuous integration for pull requests and pushes to main.
# Lint, typecheck, unit tests and build for the web app; lint and tests for the backend.
# This workflow never deploys. Production is deployed only by deploy.yml, on manual dispatch.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web lint, typecheck, unit tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Unit tests
        run: bun run test
      - name: Build
        run: bun run build

  browser:
    name: Browser tests (phone and desktop widths)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Start dev server and wait for it
        # Starting the server here, not in Playwright, makes a failure visible:
        # the status codes and the server log are printed below.
        run: |
          bun run dev -- --port 5173 --strictPort > dev-server.log 2>&1 &
          for i in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5173/ || true)
            echo "attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 2
          done
          echo "--- dev server log ---"
          cat dev-server.log
          exit 1
      - name: Browser tests
        # Project names come from playwright.config.ts (390, 768, 1280). The
        # config's webServer starts the Vite dev server for the run.
        run: bunx playwright test --project=390 --project=1280
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  backend:
    name: Backend lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: oraone_admin
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: oraone
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U oraone_admin -d oraone"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ENVIRONMENT: development
      JWT_SECRET_KEY: ci-only-jwt-secret-key-change-me-32-bytes-long
      DATABASE_URL: postgresql+asyncpg://oraone_admin:ci_password@127.0.0.1:5432/oraone
      ALEMBIC_DATABASE_URL: postgresql+psycopg2://oraone_admin:ci_password@127.0.0.1:5432/oraone
      REDIS_URL: redis://127.0.0.1:6379/0
      RUN_BACKGROUND_WORKERS: "false"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Ruff check
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Migrations
        run: alembic upgrade head
      - name: Tests
        run: python -m pytest -q -p no:cacheprovider
