# Continuous integration for pull requests and pushes to main and dev.
# Lint, typecheck, unit tests and build for the web app; lint and tests for the backend.
# This workflow never deploys. Production is deployed only by deploy.yml, on manual dispatch.
name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web lint, typecheck, unit tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Unit tests
        run: bun run test
      - name: Build
        run: bun run build

  browser:
    name: Browser tests (phone and desktop widths)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Start dev server and wait for it
        # Starting the server here, not in Playwright, makes a failure visible:
        # the status codes and the server log are printed below.
        run: |
          bun run dev -- --port 5173 --strictPort > dev-server.log 2>&1 &
          for i in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5173/ || true)
            echo "attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 2
          done
          echo "--- dev server log ---"
          cat dev-server.log
          exit 1
      - name: Browser tests
        # Project names come from playwright.config.ts (390, 768, 1280). The
        # config's webServer starts the Vite dev server for the run.
        run: bunx playwright test --project=390 --project=1280
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  backend:
    name: Backend lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: oraone_admin
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: oraone
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U oraone_admin -d oraone"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ENVIRONMENT: development
      JWT_SECRET_KEY: ci-only-jwt-secret-key-change-me-32-bytes-long
      DATABASE_URL: postgresql+asyncpg://oraone_admin:ci_password@127.0.0.1:5432/oraone
      ALEMBIC_DATABASE_URL: postgresql+psycopg2://oraone_admin:ci_password@127.0.0.1:5432/oraone
      REDIS_URL: redis://127.0.0.1:6379/0
      RUN_BACKGROUND_WORKERS: "false"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Ruff check
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Migrations
        run: alembic upgrade head
      - name: Tests
        run: python -m pytest -q -p no:cacheprovider

  production-images:
    # Builds the same images Compose ships (frontend.Dockerfile and backend/Dockerfile),
    # boots them and checks their health endpoints. Independent of the other jobs.
    name: Production images build and boot
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: oraone_admin
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: oraone
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U oraone_admin -d oraone"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Build frontend image
        run: docker build -f frontend.Dockerfile -t oraone-frontend:ci .
      - name: Build backend image
        run: docker build -t oraone-backend:ci ./backend
      - name: Start frontend container
        # Published on 127.0.0.1 only; the runner is the only client.
        run: |
          docker run -d --name oraone-frontend-ci -p 127.0.0.1:8080:8080 oraone-frontend:ci
      - name: Start backend container
        # Host networking lets the container reach the postgres and redis service
        # containers on 127.0.0.1. Values below are throwaway CI-only test values.
        env:
          JWT_SECRET_KEY: ci-only-jwt-secret-key-change-me-32-bytes-long
        run: |
          docker run -d --name oraone-backend-ci --network host \
            -e ENVIRONMENT=development \
            -e JWT_SECRET_KEY \
            -e DATABASE_URL=postgresql+asyncpg://oraone_admin:ci_password@127.0.0.1:5432/oraone \
            -e ALEMBIC_DATABASE_URL=postgresql+psycopg2://oraone_admin:ci_password@127.0.0.1:5432/oraone \
            -e REDIS_URL=redis://127.0.0.1:6379/0 \
            -e RUN_BACKGROUND_WORKERS=false \
            oraone-backend:ci
      - name: Wait for frontend GET / to return 200
        run: |
          for i in $(seq 1 45); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/ || true)
            echo "frontend attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            if [ "$(docker inspect -f '{{.State.Running}}' oraone-frontend-ci)" != "true" ]; then
              echo "frontend container stopped before it became ready"
              exit 1
            fi
            sleep 2
          done
          echo "frontend did not return HTTP 200 within 90 seconds"
          exit 1
      - name: Wait for backend GET /api/health/ready to return 200
        run: |
          for i in $(seq 1 45); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/api/health/ready || true)
            echo "backend attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            if [ "$(docker inspect -f '{{.State.Running}}' oraone-backend-ci)" != "true" ]; then
              echo "backend container stopped before it became ready"
              exit 1
            fi
            sleep 2
          done
          echo "backend did not return HTTP 200 within 90 seconds"
          exit 1
      - name: Print container logs on failure
        if: failure()
        run: |
          echo "--- frontend container logs ---"
          docker logs oraone-frontend-ci 2>&1 || true
          echo "--- backend container logs ---"
          docker logs oraone-backend-ci 2>&1 || true
      - name: Remove containers
        if: always()
        run: docker rm -f oraone-frontend-ci oraone-backend-ci || true

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: Audit web dependencies
        run: bun audit --audit-level=high

  secret-scan:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3.0.0
