name: Application checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: application-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    env:
      JWT_SECRET_KEY: ci-only-jwt-secret-key-change-me-32-bytes
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Compile Python sources
        working-directory: backend
        run: python -m compileall -q .

      - name: Run backend tests from configured test root
        working-directory: backend
        run: python -m pytest -q

  api-health:
    name: API health smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: oraone
          POSTGRES_PASSWORD: oraone
          POSTGRES_DB: oraone
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oraone -d oraone"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://oraone:oraone@127.0.0.1:5432/oraone
      ALEMBIC_DATABASE_URL: postgresql+psycopg2://oraone:oraone@127.0.0.1:5432/oraone
      REDIS_URL: redis://127.0.0.1:6379/0
      JWT_SECRET_KEY: ci-only-jwt-secret-key-change-me-32-bytes
      RUN_BACKGROUND_WORKERS: "false"
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements-dev.txt

      - name: Apply database migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Start API
        working-directory: backend
        run: |
          nohup uvicorn server:app --host 127.0.0.1 --port 8000 > /tmp/oraone-api.log 2>&1 &
          echo $! > /tmp/oraone-api.pid

      - name: Wait for liveness
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/api/health > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/oraone-api.log
          exit 1

      - name: Probe every documented safe API route
        working-directory: backend
        run: python scripts/api_health_smoke.py --base-url http://127.0.0.1:8000

  frontend:
    name: Frontend build and browser smoke tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run strict lint and format gates
        run: npm run lint:check && npm run format:check

      - name: Build production frontend
        run: npm run build

      - name: Run serial browser smoke tests
        run: npm run test:e2e -- --workers=1
