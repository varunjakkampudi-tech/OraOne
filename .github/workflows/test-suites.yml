# Test suites for OraOne Product 1.
#   web-unit        TypeScript checks and unit tests
#   backend-unit    API and database tests (pytest)
#   e2e-<suite>     Playwright suites against the running stack:
#                   smoke, sanity, critical, regression and visual
name: Test suites

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-unit:
    name: Web unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - name: Production build
        run: bun run build

  backend-unit:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: oraone_admin
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: oraone
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U oraone_admin -d oraone"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ENVIRONMENT: development
      JWT_SECRET_KEY: ci-only-jwt-secret-key-change-me-32-bytes-long
      DATABASE_URL: postgresql+asyncpg://oraone_admin:ci_password@127.0.0.1:5432/oraone
      ALEMBIC_DATABASE_URL: postgresql+psycopg2://oraone_admin:ci_password@127.0.0.1:5432/oraone
      REDIS_URL: redis://127.0.0.1:6379/0
      RUN_BACKGROUND_WORKERS: "false"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: alembic upgrade head
      - run: python -m pytest -q

  e2e:
    name: E2E ${{ matrix.suite }}
    runs-on: ubuntu-latest
    needs: [web-unit, backend-unit]
    strategy:
      fail-fast: false
      matrix:
        suite: [smoke, sanity, critical, regression, visual]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: oraone_admin
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: oraone
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U oraone_admin -d oraone"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ENVIRONMENT: development
      JWT_SECRET_KEY: ci-only-jwt-secret-key-change-me-32-bytes-long
      DATABASE_URL: postgresql+asyncpg://oraone_admin:ci_password@127.0.0.1:5432/oraone
      ALEMBIC_DATABASE_URL: postgresql+psycopg2://oraone_admin:ci_password@127.0.0.1:5432/oraone
      REDIS_URL: redis://127.0.0.1:6379/0
      RUN_BACKGROUND_WORKERS: "false"
      ALLOW_DEV_PASSWORD_LOGIN: "true"
      E2E_BASE_URL: http://127.0.0.1:4173
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Start the API
        working-directory: backend
        run: |
          pip install -r requirements-dev.txt
          alembic upgrade head
          python scripts/seed_dev_users.py
          nohup python -m uvicorn server:app --host 127.0.0.1 --port 8000 > api.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/api/health && break; sleep 2; done
      - name: Build and serve the web app
        env:
          API_PROXY_TARGET: http://127.0.0.1:8000
        run: |
          bun install --frozen-lockfile
          bun run build
          nohup bunx vite preview --host 127.0.0.1 --port 4173 --strictPort > preview.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 2; done
      - run: bunx playwright install --with-deps chromium
      - name: Run the ${{ matrix.suite }} suite
        run: bunx playwright test --grep "@${{ matrix.suite }}" --project=chromium
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.suite }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
