
# Production-like local stack — Postgres, Redis, MinIO, backend, and
# frontend all via Docker. Cognito is the intended production identity
# provider; all secrets are mandatory and supplied by the operator environment.
#
# Usage:
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: oraone-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: oraone_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: oraone
    volumes:
      - oraone_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oraone_admin -d oraone"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: oraone-redis
    restart: unless-stopped
    volumes:
      - oraone_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # The upstream public MinIO registries no longer serve this release.
    # dappros publishes the byte-identical upstream release for reproducible
    # self-hosted deployments; replace with an internally mirrored digest when
    # the deployment registry is available.
    image: dappros/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: oraone-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - oraone_minio_data:/data
    healthcheck:
      # The minimal MinIO image does not contain curl, wget, or mc. A live PID
      # check keeps Compose dependency ordering without adding tooling to the
      # storage image.
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      args:
        APP_VERSION: v1.0.0
    image: oraone-backend:v1.0.0
    container_name: oraone-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      ENVIRONMENT: production
      AUTH_PROVIDER: ${AUTH_PROVIDER:?AUTH_PROVIDER is required}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID:?COGNITO_USER_POOL_ID is required}
      COGNITO_REGION: ${COGNITO_REGION:?COGNITO_REGION is required}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID:?COGNITO_CLIENT_ID is required}
      COGNITO_DOMAIN: ${COGNITO_DOMAIN:?COGNITO_DOMAIN is required}
      DATABASE_URL: postgresql+asyncpg://oraone_admin:${DB_PASSWORD:?DB_PASSWORD is required}@postgres:5432/oraone
      ALEMBIC_DATABASE_URL: postgresql+psycopg2://oraone_admin:${DB_PASSWORD:?DB_PASSWORD is required}@postgres:5432/oraone
      REDIS_URL: redis://redis:6379/0
      ENTITLEMENTS_CACHE_BACKEND: redis
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      RUN_BACKGROUND_WORKERS: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health/ready"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  frontend:
    build:
      context: ./frontend
      args:
        APP_VERSION: v1.0.0
        REACT_APP_API_URL: ${REACT_APP_API_URL:?REACT_APP_API_URL is required}
        REACT_APP_AUTH_PROVIDER: ${AUTH_PROVIDER:?AUTH_PROVIDER is required}
        REACT_APP_COGNITO_DOMAIN: ${COGNITO_DOMAIN:?COGNITO_DOMAIN is required}
        REACT_APP_COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID:?COGNITO_CLIENT_ID is required}
        REACT_APP_COGNITO_REDIRECT_URI: ${COGNITO_REDIRECT_URI:?COGNITO_REDIRECT_URI is required}
    image: oraone-frontend:v1.0.0
    container_name: oraone-frontend
    restart: unless-stopped
    depends_on:
      - backend

  workers:
    build:
      context: ./backend
      args:
        APP_VERSION: v1.0.0
    image: oraone-backend:v1.0.0
    container_name: oraone-workers
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      ENVIRONMENT: production
      AUTH_PROVIDER: ${AUTH_PROVIDER:?AUTH_PROVIDER is required}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID:?COGNITO_USER_POOL_ID is required}
      COGNITO_REGION: ${COGNITO_REGION:?COGNITO_REGION is required}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID:?COGNITO_CLIENT_ID is required}
      COGNITO_DOMAIN: ${COGNITO_DOMAIN:?COGNITO_DOMAIN is required}
      DATABASE_URL: postgresql+asyncpg://oraone_admin:${DB_PASSWORD:?DB_PASSWORD is required}@postgres:5432/oraone
      ALEMBIC_DATABASE_URL: postgresql+psycopg2://oraone_admin:${DB_PASSWORD:?DB_PASSWORD is required}@postgres:5432/oraone
      REDIS_URL: redis://redis:6379/0
      ENTITLEMENTS_CACHE_BACKEND: redis
      RUN_BACKGROUND_WORKERS: "true"
    command: ["python", "worker.py"]
    # Workers do not expose the API health endpoint inherited from the shared
    # backend image; their process is supervised by Compose instead.
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  proxy:
    # Single edge entry point (TLS termination, gzip, security headers) —
    # The only public application entry point. Backend, frontend, Postgres,
    # Redis and MinIO remain reachable only on the internal Compose network.
    image: caddy:2-alpine
    container_name: oraone-proxy
    restart: unless-stopped
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN:?CADDY_DOMAIN is required}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - oraone_caddy_data:/data
    depends_on:
      - backend
      - frontend
      - workers

volumes:
  oraone_postgres_data:
  oraone_redis_data:
  oraone_minio_data:
  oraone_caddy_data:
