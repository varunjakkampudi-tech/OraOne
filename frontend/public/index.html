<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <meta name="theme-color" content="#2563EB" />
    <meta name="color-scheme" content="light" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg?v=6" />
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png?v=6" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png?v=6" />
    <link rel="shortcut icon" type="image/png" href="/assets/favicon-32.png?v=6" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png?v=6" />

    <!-- Preconnects used by the application -->
    <link rel="preconnect" href="https://i.pravatar.cc" crossorigin />
    <link rel="dns-prefetch" href="https://cdn.simpleicons.org" />

    <!-- Fonts: Inter (brand typeface) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Non-render-blocking: the page (and splash) paint immediately with a
         system fallback, then swap to Inter (display=swap) — vital on slow /
         low-data networks where a blocking font request stalls first paint. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" />
    </noscript>

    <!-- Primary SEO -->
    <title>OraOne</title>
    <meta name="description" content="OraOne provides AI-powered website conversations with knowledge-grounded responses and lead capture." />
    <meta name="keywords" content="AI chat agent, website chatbot, conversational AI, AI customer support, lead automation, OraOne" />
    <meta name="author" content="OraOne" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

    <!-- Open Graph -->
    <meta property="og:site_name" content="OraOne" />
    <meta property="og:title" content="OraOne - One AI. Every Conversation." />
    <meta property="og:description" content="AI-powered website conversations with knowledge-grounded responses and lead capture." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://oraone.in/" />
    <meta property="og:image" content="https://oraone.in/assets/og-image.png?v=6" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="OraOne - One AI. Every Conversation." />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="OraOne - One AI. Every Conversation." />
    <meta name="twitter:description" content="AI Chat Agents for modern businesses." />
    <meta name="twitter:image" content="https://oraone.in/assets/og-image.png?v=6" />

    <!-- Canonical (overridden per-page by useSEO) -->
    <link rel="canonical" href="https://oraone.in/" />

    <!-- JSON-LD: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "OraOne",
      "url": "https://oraone.in",
      "logo": "https://oraone.in/assets/brand-logo.png",
      "description": "AI-powered website conversations with knowledge-grounded responses and lead capture."
    }
    </script>

    <!-- JSON-LD: WebSite -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "OraOne",
      "url": "https://oraone.in",
      "inLanguage": "en-US",
      "publisher": { "@type": "Organization", "name": "OraOne" }
    }
    </script>

    <!-- JSON-LD: SoftwareApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "OraOne",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web",
      "url": "https://oraone.in",
      "description": "AI-powered website conversations with knowledge-grounded responses and lead capture."
    }
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root">
      <!-- Dependency-free splash shown instantly while the app bundle downloads
           (critical on slow / low-data networks). React replaces it on mount. -->
      <style>@keyframes ora-spin{to{transform:rotate(360deg)}}</style>
      <div style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#F6F8FC;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
        <div style="width:54px;height:54px;border-radius:50%;background:conic-gradient(from 0deg,#2563EB,#7C3AED,#DB2777,#2563EB);-webkit-mask:radial-gradient(closest-side,transparent 64%,#000 65%);mask:radial-gradient(closest-side,transparent 64%,#000 65%);animation:ora-spin .9s linear infinite"></div>
        <div style="font-size:16px;font-weight:800;letter-spacing:-.02em;color:#0A1B3A">Ora<span style="color:#2563EB">One</span></div>
      </div>
    </div>
  </body>
</html>
