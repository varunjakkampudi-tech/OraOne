[pytest]
# Run pytest from /app/backend. Adding the backend root to sys.path so that
# `from app.middleware.org_context import OrgContext` and other top-level
# imports work without requiring `export PYTHONPATH=$(pwd)`.
pythonpath = .
testpaths = tests
asyncio_mode = auto
markers =
    smoke: fast happy-path scenario, run first by scripts/verify.sh
    critical: refusals (consent, permission, signature) and tenant isolation
    regression: external-service failures and edge cases; runs after smoke and critical pass
