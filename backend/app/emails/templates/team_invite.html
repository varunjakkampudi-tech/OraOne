<h1 style="margin:0 0 16px 0; font-size:24px; line-height:32px; font-weight:800; color:#0F172A;">You're invited to join {{ org_name }}</h1>
<p style="margin:0 0 24px 0; font-size:15px; line-height:24px; color:#334155;">
  <strong>{{ inviter_name }}</strong> has invited you to collaborate on OraOne as a <strong>{{ role }}</strong>. Accept the invitation to get started.
</p>
<a href="{{ cta_url }}" style="display:inline-block; background:linear-gradient(135deg,#2563EB 0%,#4F46E5 100%); color:#FFFFFF; text-decoration:none; font-weight:600; font-size:15px; padding:12px 28px; border-radius:10px;">Accept invitation</a>
<p style="margin:28px 0 0 0; font-size:13px; line-height:20px; color:#94A3B8;">
  This invitation expires in {{ expires_in }}. If you weren't expecting it, you can ignore this email.
</p>
