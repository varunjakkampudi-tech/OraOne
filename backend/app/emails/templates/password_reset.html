<h1 style="margin:0 0 16px 0; font-size:24px; line-height:32px; font-weight:800; color:#0F172A;">Reset your password</h1>
<p style="margin:0 0 24px 0; font-size:15px; line-height:24px; color:#334155;">
  We received a request to reset the password for <strong>{{ email }}</strong>. Click below to choose a new one.
</p>
<a href="{{ cta_url }}" style="display:inline-block; background:linear-gradient(135deg,#2563EB 0%,#4F46E5 100%); color:#FFFFFF; text-decoration:none; font-weight:600; font-size:15px; padding:12px 28px; border-radius:10px;">Reset password</a>
<p style="margin:28px 0 8px 0; font-size:14px; line-height:22px; color:#64748B;">
  Or use this verification code:
</p>
<p style="margin:0 0 24px 0; font-size:28px; line-height:34px; font-weight:800; letter-spacing:0.2em; color:#2563EB;">{{ code }}</p>
<p style="margin:0; font-size:13px; line-height:20px; color:#94A3B8;">
  This link expires in {{ expires_in }}. If you didn't request a reset, ignore this email — your password stays unchanged.
</p>
