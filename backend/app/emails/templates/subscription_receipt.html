<h1 style="margin:0 0 16px 0; font-size:24px; line-height:32px; font-weight:800; color:#0F172A;">Your {{ plan_name }} subscription is active</h1>
<p style="margin:0 0 24px 0; font-size:15px; line-height:24px; color:#334155;">
  Thanks for upgrading, {{ first_name }}. Here's your receipt.
</p>
<table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="margin:0 0 24px 0; border:1px solid #E2E8F0; border-radius:12px;">
  <tr><td style="padding:14px 16px; border-bottom:1px solid #F1F5F9; font-size:14px; color:#64748B;">Plan</td><td style="padding:14px 16px; border-bottom:1px solid #F1F5F9; font-size:14px; color:#0F172A; font-weight:600; text-align:right;">{{ plan_name }}</td></tr>
  <tr><td style="padding:14px 16px; border-bottom:1px solid #F1F5F9; font-size:14px; color:#64748B;">Billing cycle</td><td style="padding:14px 16px; border-bottom:1px solid #F1F5F9; font-size:14px; color:#0F172A; text-align:right;">{{ billing_cycle }}</td></tr>
  <tr><td style="padding:14px 16px; border-bottom:1px solid #F1F5F9; font-size:14px; color:#64748B;">Amount</td><td style="padding:14px 16px; border-bottom:1px solid #F1F5F9; font-size:14px; color:#0F172A; font-weight:600; text-align:right;">{{ amount }}</td></tr>
  <tr><td style="padding:14px 16px; font-size:14px; color:#64748B;">Next renewal</td><td style="padding:14px 16px; font-size:14px; color:#0F172A; text-align:right;">{{ renewal_date }}</td></tr>
</table>
<a href="{{ cta_url }}" style="display:inline-block; background:linear-gradient(135deg,#2563EB 0%,#4F46E5 100%); color:#FFFFFF; text-decoration:none; font-weight:600; font-size:15px; padding:12px 28px; border-radius:10px;">Manage billing</a>
<p style="margin:28px 0 0 0; font-size:13px; line-height:20px; color:#94A3B8;">
  Invoice {{ invoice_number }} &middot; Charged to {{ payment_method }}.
</p>
