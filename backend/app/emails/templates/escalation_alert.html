<table role="presentation" cellpadding="0" cellspacing="0" style="margin:0 0 20px 0;">
  <tr>
    <td style="padding-left:0;">
      <span style="font-size:12px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:#2563EB;">Customer needs a person</span>
    </td>
  </tr>
</table>

<h1 style="margin:0 0 12px 0; font-size:22px; line-height:30px; font-weight:800; color:#0F172A;">A question needs your team</h1>
<p style="margin:0 0 20px 0; font-size:15px; line-height:24px; color:#334155;">
  The assistant could not answer this question from your knowledge base on <strong>{{ channel }}</strong>. It was recorded as an escalation.
</p>

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:0 0 20px 0;">
  <tr>
    <td style="background-color:#F8FAFC; border:1px solid #E2E8F0; border-radius:14px; padding:18px 16px; font-size:15px; line-height:24px; color:#0F172A;">
      {{ question }}
    </td>
  </tr>
</table>

<p style="margin:0 0 20px 0; font-size:14px; line-height:22px; color:#334155;">
  <strong>Contact:</strong> {{ contact }}
</p>

<p style="margin:0; font-size:13px; line-height:20px; color:#94A3B8;">
  Open the escalations list in OraOne to assign and resolve this item.
</p>
